<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clienți cu conturi Active și sume Negative</title>
<style>
        .button-link {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            cursor: pointer;
        }

        .button-link:hover {
            background-color: #45a049;
            border: 1px solid #45a049;
        }
    </style>
</head>
<body>
    <h1>Clienți cu conturi active si sume negative</h1>

    {% if search_results %}
        <table border="1">
            <tr>
                {% for column in columns %}
                    <th>{{ column }}</th>
                {% endfor %}
            </tr>
            {% for row in search_results %}
                <tr>
                    {% for value in row %}
                        <td>{{ value }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>Nu au fost găsite rezultate.</p>
    {% endif %}
 <a href="{{ url_for('index') }}" class="button-link">Înapoi la Pagina Principală</a>
</body>
</html>
