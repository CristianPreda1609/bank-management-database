<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizualizare Tranzacții</title>
<style>
        .button-link {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            cursor: pointer;
        }

        .button-link:hover {
            background-color: #45a049;
            border: 1px solid #45a049;
        }
    </style>
</head>
<body>
    <h1>Vizualizare Tranzactii</h1>

    {% if tranzactii %}
        <table border="1">
            <tr>
                {% for column in columns %}
                    <th>{{ column }}</th>
                {% endfor %}
                <th>Acțiuni</th> <!-- Adăugăm o coloană pentru acțiuni -->
            </tr>
            {% for row in tranzactii %}
                <tr>
                    {% for value in row %}
                        <td>{{ value }}</td>
                    {% endfor %}
                    <td>
                        <!-- Adăugați butoanele sau link-urile pentru editare și ștergere -->
                        <a href="{{ url_for('edit_tranzactie', tranzactie_id=row[0]) }}">Editare</a>
                        <a href="{{ url_for('delete_tranzactie', tranzactie_id=row[0]) }}">Ștergere</a>
                    </td>
                </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>Nu au fost găsite tranzacții.</p>
    {% endif %}

    <a href="{{ url_for('index') }}" class="button-link">Înapoi la Pagina Principală</a>
</body>
</html>
